name: GRIT iOS build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: grit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mod:
    name: Verify GRIT patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mod markers
        run: bash mod/verify.sh

  build:
    name: Build GRIT TG (simulator, arm64)
    needs: verify-mod
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          PINNED=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "Pinned Xcode: $PINNED"
          for candidate in "/Applications/Xcode_${PINNED}.app" "/Applications/Xcode-${PINNED}.app"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      # Telegram embeds source paths into the binary, so a stable path is required.
      - name: Canonical source path
        run: |
          set -euxo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios
          echo "SOURCE_DIR=/Users/Shared/telegram-ios" >> "$GITHUB_ENV"

      - name: Build
        working-directory: /Users/Shared/telegram-ios
        run: |
          set -euxo pipefail
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/grit-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect app
        working-directory: /Users/Shared/telegram-ios
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          APP=$(find bazel-bin -type d -name 'Telegram.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" "$GITHUB_WORKSPACE/artifacts/GRIT-TG.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRIT-TG-simulator-arm64
          path: artifacts/GRIT-TG.app
          if-no-files-found: error
          retention-days: 14
