name: GRIT signed IPA (your certificate)

on:
  workflow_dispatch:

jobs:
  signed-build:
    name: Build signed release IPA
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check required secrets
        env:
          P12: ${{ secrets.GRIT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GRIT_P12_PASSWORD }}
          PROFILE: ${{ secrets.GRIT_PROFILE_BASE64 }}
          TEAM: ${{ secrets.GRIT_TEAM_ID }}
          API_ID: ${{ secrets.GRIT_API_ID }}
          API_HASH: ${{ secrets.GRIT_API_HASH }}
        run: |
          set -euo pipefail
          missing=0
          for name in P12 P12_PASSWORD PROFILE TEAM API_ID API_HASH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret GRIT_${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          PINNED=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          for candidate in "/Applications/Xcode_${PINNED}.app" "/Applications/Xcode-${PINNED}.app"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Canonical source path
        run: |
          set -euxo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios
          echo "SOURCE_DIR=/Users/Shared/telegram-ios" >> "$GITHUB_ENV"

      - name: Import certificate and provisioning profile
        env:
          P12: ${{ secrets.GRIT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.GRIT_P12_PASSWORD }}
          PROFILE: ${{ secrets.GRIT_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.GRIT_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KPW="${KEYCHAIN_PASSWORD:-grit-ci}"
          KEYCHAIN="$RUNNER_TEMP/grit-signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/grit.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/grit.mobileprovision"

          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/grit.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p signing/certs signing/profiles
          cp "$RUNNER_TEMP/grit.p12" signing/certs/
          cp "$RUNNER_TEMP/grit.mobileprovision" signing/profiles/Telegram.mobileprovision

      - name: Generate signing configuration
        env:
          TEAM: ${{ secrets.GRIT_TEAM_ID }}
          API_ID: ${{ secrets.GRIT_API_ID }}
          API_HASH: ${{ secrets.GRIT_API_HASH }}
          BUNDLE_ID: ${{ vars.GRIT_BUNDLE_ID }}
        run: |
          python3 - "$TEAM" "$API_ID" "$API_HASH" "${BUNDLE_ID:-org.grit.telegram}" <<'PY'
          import json, sys
          team, api_id, api_hash, bundle_id = sys.argv[1:5]
          config = {
              "bundle_id": bundle_id,
              "api_id": api_id,
              "api_hash": api_hash,
              "team_id": team,
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "grit",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False
          }
          with open('signing/grit-signed-config.json', 'w') as f:
              json.dump(config, f, indent=2)
          print('bundle id:', bundle_id)
          PY

      - name: Build signed IPA
        working-directory: /Users/Shared/telegram-ios
        env:
          GRIT_DISABLE_EXTENSIONS: '1'
        run: |
          set -euxo pipefail
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=signing/grit-signed-config.json \
            --codesigningInformationPath=signing \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          IPA=$(find bazel-bin -type f -name 'Telegram.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" "$GITHUB_WORKSPACE/artifacts/GRIT-TG-signed.ipa"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: GRIT-TG-signed
          path: artifacts/GRIT-TG-signed.ipa
          if-no-files-found: error
          retention-days: 14
