name: GRIT device IPA (own certificate ready)

on:
  workflow_dispatch:

jobs:
  device-ipa:
    name: Build device IPA (arm64, no bundled profiles)
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          PINNED=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          for candidate in "/Applications/Xcode_${PINNED}.app" "/Applications/Xcode-${PINNED}.app"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Canonical source path
        run: |
          set -euxo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios
          echo "SOURCE_DIR=/Users/Shared/telegram-ios" >> "$GITHUB_ENV"

      - name: Build device IPA
        working-directory: /Users/Shared/telegram-ios
        env:
          GRIT_DISABLE_PROVISIONING: '1'
          GRIT_DISABLE_EXTENSIONS: '1'
        run: |
          set -euxo pipefail
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/grit-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=debug_arm64 \
            --buildNumber="$BUILD_NUMBER"

          IPA=bazel-bin/Telegram/Telegram.ipa
          if [ ! -e "$IPA" ]; then
            IPA=$(find -L bazel-bin -name 'Telegram.ipa' -print -quit || true)
          fi
          test -n "$IPA" && test -e "$IPA"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IPA" "$GITHUB_WORKSPACE/artifacts/GRIT-TG-device-unsigned.ipa"

      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: GRIT-TG-device-unsigned
          path: artifacts/GRIT-TG-device-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
